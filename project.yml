name: CarPlayTV
options:
  bundleIdPrefix: com.bharathkgowda
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CarPlayTVKit:
    path: Packages/CarPlayTVKit
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0

targets:
  CarPlayTV:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    dependencies:
      - package: CarPlayTVKit
        product: SourcesKit
      - package: CarPlayTVKit
        product: PlaybackKit
      - package: CarPlayTVKit
        product: SafetyKit
      - package: CarPlayTVKit
        product: LibraryKit
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bharathkgowda.carplaytv
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/CarPlayTV.entitlements
      properties:
        # CarPlay navigation entitlement: gives the app a drawable CPWindow on the car screen.
        # Works in the Xcode CarPlay Simulator; on a real device Apple must grant it to the team.
        com.apple.developer.carplay-maps: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CarPlayTV
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        NSLocationWhenInUseUsageDescription: CarPlayTV uses your speed, on this iPhone only, to pause video on the car display while the car is moving.
        NSLocalNetworkUsageDescription: CarPlayTV connects to media servers on your network and lets other apps cast video to it.
        NSPhotoLibraryUsageDescription: CarPlayTV imports the videos you choose so you can play them offline.
        # IPTV and home media servers are commonly plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Playlist
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.m3u-playlist]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, org.matroska.mkv, public.avi]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
